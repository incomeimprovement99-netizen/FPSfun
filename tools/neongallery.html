<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Neon gallery</title>
<style>
  html, body { margin: 0; background: #16181d; overflow: hidden; font: 12px "Segoe UI", sans-serif; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .l { position: absolute; color: #e8ecf2; background: rgba(0, 0, 0, 0.62); padding: 2px 5px; font-size: 12px; line-height: 14px; white-space: nowrap; overflow: hidden; }
  .s { position: absolute; color: #9fb3c8; background: rgba(0, 0, 0, 0.5); padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>
<div id="labels"></div>
<!--
  A contact sheet of Neon City's prefabs (tools/import-neon.ts NEON=gallery bakes them into
  models/paid/neon/gallery/<sheet>.glb): each piece in its own cell, seen from the front and a little above and to one
  side, framed to its bounds, with its name and size. ?sheet=<name>&cols=<n>. A dev page for knowing the pieces before
  planning with them (Phase 28.1); the bought files are local only.
-->
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { KTX2Loader } from "three/examples/jsm/loaders/KTX2Loader.js";
import { MeshoptDecoder } from "three/examples/jsm/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search);
const W = Number(q.get("w") ?? 1800), H = Number(q.get("h") ?? 1200);
const COLS = Number(q.get("cols") ?? 6);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setScissorTest(true);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = Number(q.get("exposure") ?? 1.1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.8;
scene.add(new THREE.HemisphereLight(0xdde6ee, 0x303038, 1.0));
const sun = new THREE.DirectionalLight(0xfff1d8, 2.2);
sun.position.set(60, 120, 90);
scene.add(sun);
const ktx2 = new KTX2Loader().setTranscoderPath("/libs/basis/").detectSupport(renderer);
const gltf = await new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder).loadAsync(`/models/paid/neon/gallery/${q.get("sheet")}.glb`);
const pieces = gltf.scene.children.filter((o) => o.userData && o.userData.id);
const rows = Math.ceil(pieces.length / COLS);
const cw = Math.floor(W / COLS), ch = Math.floor(H / Math.max(1, rows));
const labels = document.getElementById("labels");
const cam = new THREE.PerspectiveCamera(35, cw / ch, 0.01, 5000);
renderer.setClearColor(0x1d2027);
renderer.clear();
pieces.forEach((p, i) => {
  scene.add(p);
  const box = new THREE.Box3().setFromObject(p);
  const size = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  const r = Math.max(0.05, size.length() / 2);
  const col = i % COLS, row = Math.floor(i / COLS);
  const x = col * cw, y = H - (row + 1) * ch;
  // from the front (+z, the pack's facing) and a little to the side and above
  const dir = new THREE.Vector3(0.55, 0.42, 1).normalize();
  const dist = r / Math.sin(THREE.MathUtils.degToRad(cam.fov / 2)) * 1.02;
  cam.position.copy(c).addScaledVector(dir, dist);
  cam.near = dist / 100;
  cam.far = dist * 4;
  cam.lookAt(c);
  cam.updateProjectionMatrix();
  renderer.setViewport(x, y, cw, ch);
  renderer.setScissor(x, y, cw, ch);
  renderer.setClearColor(i % 2 ? 0x1d2027 : 0x20242c);
  renderer.clear();
  renderer.render(scene, cam);
  scene.remove(p);
  const l = document.createElement("div");
  l.className = "l";
  l.style.left = `${x + 2}px`;
  l.style.top = `${row * ch + 2}px`;
  l.style.maxWidth = `${cw - 8}px`;
  l.textContent = `${i + 1}. ${p.userData.id.split("/").pop().replace(".prefab", "")}`;
  labels.appendChild(l);
  const s = document.createElement("div");
  s.className = "s";
  s.style.left = `${x + 2}px`;
  s.style.top = `${row * ch + ch - 18}px`;
  s.textContent = `${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)} m`;
  labels.appendChild(s);
});
window.__done = true;
</script>
</body>
</html>
